# Render Blueprint - Infrastructure as Code for CodeVenture
# This file manages both the web service and database together

databases:
  - name: codeventure-db
    plan: free
    databaseName: codeventure_db
    user: codeventure_db_user
    region: singapore

services:
  - type: web
    name: codeventure
    env: python
    plan: free
    region: singapore
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn CodeVenture.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DJANGO_SETTINGS_MODULE
        value: CodeVenture.settings
      - key: DJANGO_DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: codeventure-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
        sync: false

