services:
  - type: web
    name: codeventure
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn CodeVenture.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DJANGO_SETTINGS_MODULE
        value: CodeVenture.settings
      - key: DJANGO_DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 2

