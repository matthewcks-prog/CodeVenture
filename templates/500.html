<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>Server Error — CodeVenture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .code {
            font-size: 6rem;
            font-weight: 700;
            color: #e74c3c;
        }
        h1 { font-size: 1.5rem; margin: 0.5rem 0 1rem; }
        p { color: #666; margin-bottom: 2rem; max-width: 400px; margin-left: auto; margin-right: auto; }
        a {
            display: inline-block;
            background: #6c63ff;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover { background: #5a52d5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">500</div>
        <h1>Something Went Wrong</h1>
        <p>We're sorry — an unexpected error occurred. Please try again later or contact support if the problem persists.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
